<!DOCTYPE html>
<html>
<head>
    <title>Text Analysis Toolkit</title>
</head>
<body>

    <h1>Text Analysis Toolkit</h1>

    <p>Upload a text file to analyze it.</p>

    {% if error %}
    <p>{{ error }}</p>
    {% endif %}

    <form action="/analyze" method="POST" enctype="multipart/form-data">

        <input type="file" name="file" accept=".txt">

        <button type="submit">Analyze File</button>

    </form>


</body>
</html>
