<!DOCTYPE html>
<html>
<head>
    <title>Compare Text Files</title>
</head>
<body>
<nav>
    <a href="/">Analyze File</a> |
    <a href="/compare">Compare Files</a>
</nav>

<br>
    <h1>Compare Text Files</h1>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<p>Select two text files to compare.</p>

    <form action="/compare" method="POST" enctype="multipart/form-data">

        <label>First file:</label>
        <input type="file" name="file1" accept=".txt">

        <br><br>

        <label>Second file:</label>
        <input type="file" name="file2" accept=".txt">

        <br><br>

        <button type="submit">Compare Files</button>

    </form>

</body>
</html>
